services:
  postgres:
    image: postgres:16
    container_name: bigdata_p2_postgres
    environment:
      POSTGRES_DB: itaca_academico
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_nuevo:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data_nuevo:
